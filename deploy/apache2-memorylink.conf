# Example Apache 2.4 reverse proxy for MemoryLink.
#
# Install:
#   apt install apache2 python3-certbot-apache
#   a2enmod proxy proxy_http ssl headers
#   cp deploy/apache2-memorylink.conf /etc/apache2/sites-available/memorylink.conf
#   a2ensite memorylink
#   apache2ctl configtest && systemctl reload apache2
#
# Replace frame.example.com and the certificate paths for your domain. Obtain
# the certificate first, for example with:
#   certbot certonly --standalone -d frame.example.com
#
# Uvicorn listens on loopback only; never expose port 8000 directly.

<VirtualHost *:80>
    ServerName frame.example.com
    Redirect permanent / https://frame.example.com/
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName frame.example.com

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/frame.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/frame.example.com/privkey.pem

    ProxyPreserveHost On
    # The frame keeps a 15-second long poll open; leave headroom for uploads.
    ProxyTimeout 75
    Timeout 120
    # Up to 250 MB, enough for a 200 MB APK plus multipart overhead.
    LimitRequestBody 262144000

    ProxyPass / http://127.0.0.1:8000/ retry=0 timeout=75
    ProxyPassReverse / http://127.0.0.1:8000/

    Header always set Strict-Transport-Security "max-age=31536000" env=HTTPS
    SetEnv proxy-sendchunked 1

    # Optional HTTP Basic auth for both the web UI and the frame. Create the
    # password file with:
    #   htpasswd -c /etc/memorylink.htpasswd admin
    # Then enter https://admin:password@frame.example.com in the Android app.
    #<Location />
    #    AuthType Basic
    #    AuthName "MemoryLink"
    #    AuthUserFile /etc/memorylink.htpasswd
    #    Require valid-user
    #</Location>

    ErrorLog ${APACHE_LOG_DIR}/memorylink-error.log
    CustomLog ${APACHE_LOG_DIR}/memorylink-access.log combined
</VirtualHost>
</IfModule>
